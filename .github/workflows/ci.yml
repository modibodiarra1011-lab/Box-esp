name: ESP32 LAB CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Contrôles Python et dépôt
        run: |
          python scripts/verify_project.py
          python scripts/check_idf61_compat.py
          python scripts/ci_static.py
          python scripts/verify_worker_arduino.py
          python scripts/verify_web_contract.py
          python scripts/verify_release_60x.py
          python scripts/verify_100k.py

  build-master:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Installer ESP-IDF 6.1
        uses: espressif/install-esp-idf-action@v1
        with:
          version: v6.1
      - name: Construire le MASTER ESP32-S3
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          cd firmware/master
          idf.py set-target esp32s3
          idf.py reconfigure
          idf.py -j 2 build

  build-worker-arduino-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.x'
      - name: Installer ESP32 Arduino 3.3.12
        shell: bash
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
      - name: Compiler le WORKER comme Arduino IDE
        shell: bash
        run: |
          mkdir -p build/worker-arduino-cli
          arduino-cli compile \
            --fqbn 'esp32:esp32:esp32:UploadSpeed=921600,CPUFreq=240,FlashFreq=80,FlashMode=qio,FlashSize=4M,PartitionScheme=default,DebugLevel=none,PSRAM=disabled,LoopCore=1,EventsCore=1,EraseFlash=none,JTAGAdapter=default,ZigbeeMode=default' \
            --warnings all \
            --output-dir build/worker-arduino-cli \
            WORKER/Arduino
      - name: Publier le binaire CI
        uses: actions/upload-artifact@v4
        with:
          name: worker-arduino-cli
          path: build/worker-arduino-cli/
          if-no-files-found: error

  build-worker-platformio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer PlatformIO Core
        run: python -m pip install --upgrade platformio
      - name: Compiler le WORKER via pioarduino / PlatformIO
        run: pio run -d WORKER/Arduino -e esp32-worker
      - name: Publier le binaire CI
        uses: actions/upload-artifact@v4
        with:
          name: worker-platformio
          path: WORKER/Arduino/.pio/build/esp32-worker/
          if-no-files-found: error
